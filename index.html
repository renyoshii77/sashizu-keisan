<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指図書 自動計算</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--sub:#6b7280;--line:#e3e6ea;--acc:#2563eb;--ok:#15803d;--okbg:#dcfce7;--ng:#b91c1c;--ngbg:#fee2e2;--calc:#eef4ff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1c2029;--tx:#e8eaed;--sub:#9aa1ad;--line:#2d3340;--acc:#60a5fa;--ok:#4ade80;--okbg:#14321f;--ng:#f87171;--ngbg:#3a1717;--calc:#1b2740}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;padding:10px 16px 6px}
nav{display:flex;overflow-x:auto;gap:4px;padding:0 12px 8px}
nav button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:16px;padding:6px 12px;font-size:13px}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card summary{cursor:pointer;list-style:none}.card summary::-webkit-details-marker{display:none}
.card summary h2{display:inline}.card summary::after{content:'　▼ 開く';font-size:12px;color:var(--sub)}
details[open].card summary::after{content:'　▲ 閉じる'}
details[open].card summary{margin-bottom:4px}
.card h2{font-size:14px;margin:0 0 4px}
.card .ref{font-size:11px;color:var(--sub);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{display:block;font-size:12px;color:var(--sub)}
input{width:100%;font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx)}
.out{background:var(--calc);border-radius:8px;padding:7px 8px;font-size:16px;font-weight:600;min-height:36px}
.out small{font-weight:400;color:var(--sub);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.ok{background:var(--okbg);color:var(--ok)}.ng{background:var(--ngbg);color:var(--ng)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);gap:8px}
.row:last-child{border-bottom:none}
.eq{font-size:13px;color:var(--sub);margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}
th:first-child,td:first-child{text-align:left}
.grid>div,.grid3>div{min-width:0}
input{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none;min-height:40px}
input[type=date]{width:100%}
label{min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat{border-top:1px solid var(--line);padding:10px 0}
.mat:first-of-type{border-top:none}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.mh span{font-size:12px;color:var(--sub)}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;background:var(--calc);border-radius:8px;padding:8px}
.ms b{display:block;font-size:16px}.ms small{display:block;font-size:11px;color:var(--sub)}
.ms label{font-size:11px}
.full{grid-column:1/-1}
#kb{position:fixed;left:0;right:0;top:auto;bottom:auto;z-index:20;display:flex;gap:8px;padding:6px 10px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(0,0,0,.08)}
#kb button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:8px;padding:9px;font-size:15px;font-weight:600}
#kb button[data-kb="1"]{background:var(--acc);border-color:var(--acc);color:#fff;flex:1.5}
#kb.hide{display:none}
nav button{position:relative}.dot{position:absolute;top:2px;right:4px;width:9px;height:9px;border-radius:50%;background:#dc2626;border:2px solid var(--card)}
.alert{background:var(--ngbg);color:var(--ng);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}.alert b{display:block;margin-bottom:2px}
.tchips{margin-bottom:8px}.tchips button{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:14px;padding:5px 12px;font-size:13px}.tchips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tr{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed var(--line);font-size:14px}.tr b{font-weight:500}.tr.em b{font-weight:700;color:var(--acc)}
.th{font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 2px}
.tm{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:4px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);text-align:right}.tm span{text-align:left}.tm b{font-weight:500}.tm .neg{color:var(--ng)}.tmh b{font-size:11px;color:var(--sub)}
#upd{display:block;width:100%;border:none;background:var(--acc);color:#fff;font-size:14px;font-weight:600;padding:12px 16px;text-align:center}
#curlot{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
.lotrow{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.lotrow small{display:block;font-size:12px;color:var(--sub)}
.lotrow.on{border-color:var(--acc);border-width:2px}
.newlot{width:100%;border:1px dashed var(--acc);background:transparent;color:var(--acc);border-radius:10px;padding:10px;font-size:15px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font-size:16px;font-weight:600}
.seg button small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}.seg button.on small{color:#fff}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ng);border-radius:8px;padding:8px 12px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--calc);border-radius:8px;padding:3px 8px;font-size:13px}
.hide{display:none!important}
</style>
</head>
<body>
<header>
<h1>指図書 自動計算<span id="curlot"></span></h1>
<nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="kb" class="hide"><button data-kb="-1">▲ 前</button><button data-kb="1">▼ 次へ</button><button data-kb="0">完了</button></div>
<script>
const KEY='sashizu-keisan-v1';
const VERSION='2026-11-12a';
const PER=120;
const PROD={'メジコン':10,'アスベリン':3};
const MN={ptp:'PTPシート',cs:'ケース',tp:'添付文書',pk:'PK'};
const blankDay=()=>({date:'',yotei:'',kari:'',saikako:'',ok:'',gaikan:'',melt:'',keika:'',inji:'',ijou:'',shizai:'',sonota:'',A:'',B:'',hosoLoss:'',
 mat:{ptp:{out:'',loss:''},cs:{out:'',loss:''},tp:{out:'',loss:''},pk:{out:'',loss:''}}});
const blank=()=>({lot:{hinmei:'',ryaku:'',no:'',kigen:'',chukan:'',yotei:'',kentai:3,ptpPer:2,ptpUke:''},
 days:[blankDay(),blankDay(),blankDay(),blankDay(),blankDay()]});
const LKEY='sashizu-keisan-lots-v1';
const newId=()=>'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let DB=null;try{DB=JSON.parse(localStorage.getItem(LKEY)||localStorage.getItem(LKEY+'-bk'))}catch(e){}
if(!DB||!DB.lots||!Object.keys(DB.lots).length){const id=newId();DB={cur:id,lots:{[id]:blank()}}}
try{const raw=localStorage.getItem(KEY)||localStorage.getItem(KEY+'-bk');if(raw&&!localStorage.getItem(KEY+'-migrated')){const old=JSON.parse(raw);const dup=Object.values(DB.lots).some(x=>JSON.stringify({l:x.lot,d:x.days})===JSON.stringify({l:old.lot,d:old.days}));if(!dup){const empty=Object.entries(DB.lots).find(([k,x])=>JSON.stringify({l:x.lot,d:x.days})===JSON.stringify({l:blank().lot,d:blank().days}));if(empty)delete DB.lots[empty[0]];const id=newId();old.updated=Date.now();DB.lots[id]=old;DB.cur=id}localStorage.setItem(KEY+'-migrated','1')}}catch(e){}
for(const x of Object.values(DB.lots)){x.days=x.days||[];while(x.days.length<5)x.days.push(blankDay());x.days.forEach(d=>{d.mat=d.mat||{};for(const k of ['ptp','cs','tp','pk'])d.mat[k]=d.mat[k]||{out:'',loss:''}})}
if(!DB.lots[DB.cur])DB.cur=Object.keys(DB.lots)[0];
let S=DB.lots[DB.cur];
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let tab='lot';try{tab=localStorage.getItem(KEY+'-tab')||'lot'}catch(e){}
if(!['lot','d0','d1','d2','d3','d4','sum'].includes(tab))tab='lot';
const save=(touch)=>{if(touch===true)S.updated=Date.now();DB.lots[DB.cur]=S;try{const j=JSON.stringify(DB);localStorage.setItem(LKEY,j);localStorage.setItem(LKEY+'-bk',j);localStorage.setItem(KEY+'-tab',tab)}catch(e){}};
addEventListener('pagehide',save);document.addEventListener('visibilitychange',save);
const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const has=v=>v!==''&&v!=null;
const f=v=>Number(v).toLocaleString('ja-JP');
const rnd=(v,d)=>Math.round(v*10**d+1e-9)/10**d;
const trunc=(v,d)=>Math.floor(v*10**d+1e-9)/10**d;
const median=a=>{const b=a.slice().sort((x,y)=>x-y);return b[1]};
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const set=(p,v)=>{const k=p.split('.');const last=k.pop();k.reduce((o,x)=>o[x],S)[last]=v};

function inp(p,lab,opt={}){const v=get(p);return `<div><label>${lab}</label><input data-p="${p}" type="${opt.t||'number'}" inputmode="${opt.t?'text':'decimal'}" enterkeyhint="next" value="${v??''}" placeholder="${opt.ph||''}"></div>`}
function out(lab,val,id){return `<div><label>${lab}</label><div class="out" id="${id||''}">${val}</div></div>`}
const judge=(ok,a='適',b='不適')=>`<span class="badge ${ok?'ok':'ng'}">${ok?a:b}</span>`;

/* ---------- 計算 ---------- */
let CC={};
function prevCum(i){let prev=0;const src=[];for(let k=0;k<i;k++){const c=calcDay(k);const v=c.dek>0?c.dek:c.final;prev+=v;if(v>0)src.push(`${k+1}日目 ${f(v)}`)}return {prev,src}}
function lossUnits(i){let sh=0;for(let k=0;k<i;k++)sh+=n(S.days[k].hosoLoss);return Math.ceil(sh/2)}
function dayYotei(i){return Math.max(n(S.lot.yotei)-prevCum(i).prev-lossUnits(i),0)}
function calcDay(i){if(CC[i])return CC[i];return CC[i]=calcDay0(i)}
function calcDay0(i){
 const d=S.days[i],L=S.lot;
 const ken=has(d.kentai)?n(d.kentai):(i===0?n(L.kentai):0);
 const furyo=['gaikan','melt','keika','sonota'].reduce((s,k)=>s+n(d[k]),0);
 const sasu=n(d.ok)-n(d.kari)-ken-furyo;
 const sLoss=n(d.inji)+n(d.ijou)+n(d.moto)+furyo;
 const final=n(d.kari)+n(d.saikako);
 const final0=n(d.kari)+n(d.saikako);
 const manAB=has(d.A)||has(d.B);
 const autoA=Math.floor(final0/PER),autoB=final0%PER;
 const A=manAB?n(d.A):autoA,B=manAB?n(d.B):autoB;
 const dek=A*PER+B;
 const used=has(d.A)||has(d.B)||has(d.kari);
 const pkUnits=A+(B>0?1:0);
 const prod={ptp:dek*2,cs:dek,tp:dek,pk:pkUnits};
 const kenM={ptp:ken*2,cs:ken,tp:ken,pk:0};
 const mats={};
 for(const k of ['ptp','cs','tp','pk']){
  const prev=i>0&&k!=='ptp'?calcDay(i-1).mats[k].carry:null;
  const o=has(d.mat[k].out)?n(d.mat[k].out):(prev!=null&&prev>0?prev:0);
  const autoL=k==='cs'&&!has(d.mat[k].loss);
  const hl=k==='ptp'?n(d.hosoLoss):0;
  const tk=k==='cs'?n(d.mat[k].tenken):0;
  const base=autoL?sLoss:n(d.mat[k].loss);
  const ls=base+hl+tk;
  const total=prod[k]+kenM[k]+ls;
  const lossAll=kenM[k]+ls;
  mats[k]={out:o,auto:!has(d.mat[k].out)&&prev!=null,autoL,hl,tk,base,prod:prod[k],ken:kenM[k],loss:ls,lossAll,total,carry:o-total};
 }
 const yt=dayYotei(i);
 const dy=yt>0?rnd(dek/yt*100,1):null;
  const iss=[];
 if(used&&sasu!==0)iss.push('差数が '+f(sasu));
 for(const k of ['ptp','cs','tp','pk']){const m=mats[k];if(used&&(has(d.mat[k].out)||m.auto)&&m.carry<0)iss.push(MN[k]+'の'+(k==='ptp'?'払戻':'繰越')+'がマイナス（'+f(m.carry)+'）')}
 if(n(d.saiPtp)%2!==0)iss.push('再加工品（PTPシート）が奇数（添付文書がPTP÷2で割り切れへん）');
 if(used&&manAB&&dek!==final)iss.push('（A）（B）の出来高 '+f(dek)+' と最終出来高 '+f(final)+' が違う');
 return {ken,furyo,sasu,sLoss,final,dek,used,mats,dy,yt,A,B,manAB,autoA,autoB,iss};
}
function cum(){let c=0;const r=[];for(let i=0;i<S.days.length;i++){const x=calcDay(i);c+=x.dek;r.push({...x,cum:c})}return r}

/* ---------- 画面 ---------- */
const TABS=[['sum','収率まとめ'],['lot','ロット情報'],['d0','1日目'],['d1','2日目'],['d2','3日目'],['d3','4日目'],['d4','5日目']];
const lotName=x=>`${x.lot.hinmei||'品名未選択'}　${x.lot.no||'製造番号なし'}`;
function tabIss(k){if(k[0]==='d')return calcDay(+k[1]).iss.length;if(k==='sum')return S.days.some((_,i)=>calcDay(i).iss.length)?1:0;return 0}
function renderNav(){const cl=document.getElementById('curlot');if(cl)cl.textContent=lotName(S);document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}${tabIss(k)?'<i class="dot"></i>':''}</button>`).join('')}

function vLot(){
 const L=S.lot,y=n(L.yotei);
 return `
 <div class="card"><h2>ロット基本情報</h2>
 <div class="eq" style="margin-top:0">品名（選ぶと検体数が自動で入る）</div>
 <div class="seg">${Object.entries(PROD).map(([k,v])=>`<button data-prod="${k}" class="${(S.lot.prod||S.lot.hinmei)===k?'on':''}">${k}<small>検体 ${v}個</small></button>`).join('')}</div>
 <div class="grid">
 ${inp('lot.no','製造番号',{t:'text'})}${inp('lot.kigen','使用期限',{t:'text',ph:'2029.3'})}
 ${inp('lot.chukan','中間製品の製造番号',{t:'text'})}
 ${inp('lot.kentai','検体数（1日目・個）')}${inp('lot.ptpUke','PTP受入数（全量・枚）')}
 </div></div>

 <div class="card"><h2>保存してるロット</h2><div class="ref">入力は自動で保存。前のロットもタップで開き直せる</div>
 ${Object.entries(DB.lots).sort((a,b)=>(b[1].updated||0)-(a[1].updated||0)).map(([id,x])=>{const d0=x.days.find(d=>d.date);return `<button class="lotrow ${id===DB.cur?'on':''}" data-open="${id}"><b>${lotName(x)}</b><small>${d0?d0.date+' 開始':''}${id===DB.cur?(d0?'　':'')+'今開いてる':''}</small></button>`}).join('')}
 <button class="newlot" id="newlot">＋ 新しいロットを始める</button></div>
 <button class="btn" id="reset">このロットを削除</button>`;
}
function adhView(i){
 const {prev,src}=prevCum(i);
 const lim=Math.min(dayYotei(i),17000);
 const pts=[];for(let c=Math.floor(prev/1000)*1000+1000;c<prev+lim;c+=1000)pts.push(c);
 const head=`<div class="eq">前日までの累計出来高：<b>${f(prev)}</b> 個${src.length?'（'+src.join('＋')+'）':''}</div>`;
 if(lim<=0)return head+'<div class="eq">1日目に製造予定数量を入れると表示</div>';
 return head+`<table><tr><th>試験（累計）</th><th>検査モニターの数</th></tr>
 <tr><td>作業開始時</td><td>0</td></tr>
 ${pts.map(c=>`<tr><td>${f(c)}個目</td><td><b>${f(c-prev)}</b></td></tr>`).join('')}
 <tr><td>作業終了時</td><td>—</td></tr></table><div class="eq">この日の試験 ${pts.length+2} 回</div>`;
}
function vDay(i){
 const p=`days.${i}`,c=calcDay(i),L=S.lot;
 const mN={ptp:['6679','PTPシート','枚'],cs:['4644','ケース','個'],tp:['4646','添付文書','枚'],pk:['4647','PK','個']};
 return `<div class="alert${c.iss.length?'':' hide'}"><b>要確認</b>${c.iss.map(x=>'<div>・'+x+'</div>').join('')}</div>
 <div class="card"><h2>${i+1}日目 基本</h2>
 <div class="grid">${inp(p+'.date','作業年月日',{t:'date'})}${i===0?inp('lot.yotei','製造予定数量（個）'):out('予定数量（残り）',f(c.yt)+' 個')}</div>
 ${i>0?'<div class="eq">'+f(n(S.lot.yotei))+' − 前日までの出来高 '+f(prevCum(i).prev)+(lossUnits(i)?' − 包装ロス分 '+f(lossUnits(i)):'')+'</div>':''}</div>


 <details class="card"><summary><h2>接着強度試験のタイミング</h2></summary><div class="ref">作業開始時・作業終了時・累計1,000個毎（前日までの出来高から続けて計算・1日最大17,000個）</div>
 ${adhView(i)}</details>

 <div class="card"><h2>差数管理（ケース）</h2><div class="ref">検査OK数 − 製品出来高(仮) − 検体数 − 不良品数 ＝ 0</div>
 <div class="grid">${inp(p+'.ok','検査OK数')}${inp(p+'.kari','製品出来高（仮）')}</div>
 <div class="eq">不良品数の内訳</div>
 <div class="grid">${inp(p+'.gaikan','外観不良')}${inp(p+'.melt','メルト不良')}
 ${inp(p+'.keika','軽過量不良')}${inp(p+'.sonota','その他不良')}</div>
 <div class="grid" style="margin-top:8px"><div><label>検体数（個）</label><input data-p="${p}.kentai" type="number" inputmode="decimal" enterkeyhint="next" value="${S.days[i].kentai??''}" placeholder="${c.ken}"></div>${out('不良品数 ※1',f(c.furyo)+' 個')}</div>
 <div class="row" style="margin-top:6px"><span>${f(n(S.days[i].ok))}−${f(n(S.days[i].kari))}−${f(c.ken)}−${f(c.furyo)} ＝ <b>${f(c.sasu)}</b></span>${c.used?judge(c.sasu===0,'差数0','差数あり'):''}</div>
 <div class="eq" style="margin-top:10px">資材ロス（不良品数※1も含む）</div>
 <div class="grid3">${inp(p+'.inji','印字検査不良')}${inp(p+'.ijou','異常品数')}${inp(p+'.moto','元不良数')}</div>
 <div class="row" style="margin-top:6px"><span>${f(n(S.days[i].inji))}＋${f(n(S.days[i].ijou))}＋${f(n(S.days[i].moto))}＋${f(c.furyo)}（※1）</span><span>資材ロス <b>${f(c.sLoss)}</b> 個</span></div>
 <div class="eq" style="margin-top:10px">再加工</div>
 <div class="grid">${inp(p+'.saiPtp','再加工品（PTPシート）')}${out('再加工品（添付文書）',f(n(S.days[i].saiPtp)/2)+' <small>PTP÷2</small>')}${inp(p+'.saiCs','ケース使用数')}</div>
 <div class="grid" style="margin-top:8px">${inp(p+'.saikako','再加工品の出来高')}${out('製品出来高（最終）',f(c.final)+' 個')}</div>
 <div class="eq">製品出来高（仮）${f(n(S.days[i].kari))} ＋ 再加工品の出来高 ${f(n(S.days[i].saikako))} ＝ <b>${f(c.final)}</b>（再加工品を含む出来高数量）</div></div>

 <div class="card"><h2>出来高・収率確認</h2><div class="ref">（A）×120＋（B）</div>

function vSum(){

 const lastU=S.days.reduce((a,_,i)=>calcDay(i).used?i:a,-1);
 const fin=y>0&&lastU>=0&&(lastU===S.days.length-1||dayYotei(lastU+1)===0);
 const allIss=S.days.flatMap((_,i)=>calcDay(i).iss.map(x=>(i+1)+'日目：'+x));
 return `<div class="alert${allIss.length?'':' hide'}"><b>要確認</b>${allIss.map(x=>'<div>・'+x+'</div>').join('')}</div>
 <div class="card"><h2>紙に写す数字</h2><div class="ref">指図書の欄と同じ順番。太字は計算した数字</div>${tsView()}</div>

 <table><tr><th>日程</th><th>予定数量</th><th>出来高</th><th>収率</th><th>累計</th><th>差数</th></tr>
 ${r.map((x,i)=>`<tr><td>${i+1}日目</td><td>${n(S.lot.yotei)?f(x.yt):'—'}</td><td>${x.used?f(x.dek):'—'}</td><td>${x.dy!=null&&x.used?x.dy.toFixed(1)+'%':'—'}</td><td>${x.used?f(x.cum):'—'}</td><td>${x.used?judge(x.sasu===0,'0',f(x.sasu)):''}</td></tr>`).join('')}</table>
 <div class="eq">使わなかった日の記録欄は斜線を引く</div></div>

 <div class="card"><h2>1ロットの収率</h2><div class="ref">製造出来高(累計)÷1ロットの製造予定数量×100　期待収率100.0%・規定95.0%以上</div>
 <div class="grid">${out('製造予定数量',f(y)+' 個')}${out('製造出来高（累計）',f(total)+' 個')}</div>
 <div class="row" style="margin-top:8px"><span style="font-size:20px;font-weight:700">${yr!=null?yr.toFixed(1)+' %':'—'}</span>${yr!=null?(fin?judge(yr>=95,'95.0%以上 適','95.0%未満 不適'):'<span class="badge" style="background:var(--calc)">ロット途中</span>'):''}</div>

 <div class="card"><h2>PTPシート 受入と使用</h2>

}

function render(){
 CC={};
 renderNav();
 const m=document.getElementById('main');
 m.innerHTML=tab==='lot'?vLot():tab==='sum'?vSum():vDay(+tab[1]);
}
function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 if(a.nodeType!==1)return;
 for(const at of [...a.attributes])if(!b.hasAttribute(at.name)&&at.name!=='open')a.removeAttribute(at.name);
 for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value&&!(a.nodeName==='INPUT'&&at.name==='value'))a.setAttribute(at.name,at.value);
 if(a.nodeName==='INPUT'){if(a!==document.activeElement&&a.value!==b.value)a.value=b.value;return}
 const ac=[...a.childNodes],bc=[...b.childNodes];
 bc.forEach((n,i)=>{ac[i]?morph(ac[i],n):a.appendChild(n)});
 for(let i=bc.length;i<ac.length;i++)ac[i].remove();
}
function refresh(){
 CC={};
 const m=document.getElementById('main'),t=document.createElement('main');
 t.innerHTML=tab==='lot'?vLot():tab==='sum'?vSum():vDay(+tab[1]);
 morph(m,t);m.id='main';
 renderNav();
}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function todayTab(){const t=today();let i=S.days.findIndex(d=>d.date===t);if(i<0){const last=S.days.map(d=>d.date).reduce((a,d,k)=>d?k:a,-1);if(last>=0&&S.days[last].date<t&&last<S.days.length-1)i=last+1;else if(last<0&&S.days[0].date==='')i=-1}return i}
document.addEventListener('input',e=>{const p=e.target.dataset.p;if(!p)return;const dm=p.match(/^days\.(\d)\.(?!date)/);if(dm&&!S.days[+dm[1]].date)S.days[+dm[1]].date=today();set(p,e.target.value);save(true);refresh()});
document.addEventListener('click',e=>{
 const pr=e.target.closest('[data-prod]');if(pr){const k=pr.dataset.prod;S.lot.prod=k;S.lot.kentai=String(PROD[k]);S.lot.hinmei=k;save(true);refresh();return}
 const td=e.target.closest('[data-tday]');if(td){tday=+td.dataset.tday;refresh();return}
 const t=e.target.dataset.tab;if(t){tab=t;save();render();window.scrollTo(0,0);return}
 const op=e.target.closest('[data-open]');if(op){DB.cur=op.dataset.open;S=DB.lots[DB.cur];tab='sum';save();render();window.scrollTo(0,0);return}
 if(e.target.id==='newlot'){const id=newId();DB.lots[id]=blank();DB.cur=id;S=DB.lots[id];tab='lot';save(true);render();window.scrollTo(0,0);return}
 if(e.target.id==='reset'&&confirm('「'+lotName(S)+'」を削除する？ 1〜5日目も含めて全部消えるで。')&&confirm('ほんまに消してええ？ 元に戻されへんで。')){delete DB.lots[DB.cur];const rest=Object.entries(DB.lots).sort((a,b)=>(b[1].updated||0)-(a[1].updated||0));if(rest.length){DB.cur=rest[0][0]}else{const id=newId();DB.lots[id]=blank();DB.cur=id}S=DB.lots[DB.cur];tab='lot';save();render()}
});
{const ti=todayTab();if(ti>=0)tab='d'+ti}
render();
/* ---------- キーボード 次へ ---------- */
const kb=document.getElementById('kb');
function fields(){return [...document.querySelectorAll('main input[data-p]')].filter(x=>x.offsetParent!==null&&x.type!=='date')}
function moveF(d){const a=document.activeElement,fs=fields(),i=fs.indexOf(a);if(d===0||i<0){a&&a.blur();return}const nx=fs[i+d];if(nx){nx.focus();nx.scrollIntoView({block:'center',behavior:'smooth'})}else a.blur()}
function placeKb(){const vv=window.visualViewport;if(!vv){kb.style.bottom='0px';return}kb.style.top=(vv.offsetTop+vv.height-kb.offsetHeight)+'px'}
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('main input[data-p]')&&e.target.type!=='date'){kb.classList.remove('hide');placeKb()}});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('main input[data-p]')))kb.classList.add('hide')},50));
if(window.visualViewport){visualViewport.addEventListener('resize',placeKb);visualViewport.addEventListener('scroll',placeKb)}
kb.addEventListener('pointerdown',e=>e.preventDefault());kb.addEventListener('mousedown',e=>e.preventDefault());
kb.addEventListener('click',e=>{const b=e.target.closest('[data-kb]');if(b)moveF(+b.dataset.kb)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('main input[data-p]')){e.preventDefault();moveF(1)}});
function checkUpdate(){if(location.protocol==='file:')return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const VERSION='([^']+)'/);if(m&&m[1]!==VERSION&&!document.getElementById('upd')){const d=document.createElement('button');d.id='upd';d.textContent='新しい版があるで（タップで更新・データはそのまま）';d.onclick=()=>{save();location.replace(location.pathname+'?v='+Date.now())};document.body.prepend(d)}}).catch(()=>{})}
checkUpdate();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
</script>
